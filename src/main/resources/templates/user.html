<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>User page</title>
</head>
<style>
    body {
        background-color: rgb(243, 243, 243);
    }
</style>
<body>
<header>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <div class="justify-content-start" id="userInfo">
                <!-- Будет заполнено через JavaScript -->
            </div>
            <div>
                <a class="navbar-brand text-white-50" href="#" id="logoutBtn">Logout</a>
            </div>
        </div>
    </nav>
</header>
<div class="d-flex w-auto" style="height: 1000px;">
    <div class="mt-4 w-25 top-25 start-0 bg-white h-100">
        <ul class="nav nav-pills flex-column bg-white" id="usersSidebar">
            <!-- Список пользователей будет заполняться через JavaScript -->
        </ul>
    </div>
    <div class="container-fluid ps-5 pe-5">
        <div class="container-sm p-3 ms-0 ps-0 fw-bold fs-1">
            User information-page
        </div>
        <nav class="navbar navbar-light bg-light border-top">
            <div class="container-fluid">
                <span class="navbar-brand mb-0 h1">User</span>
            </div>
        </nav>
        <div class="w-100 min-vh-75 d-flex pt-4 justify-content-center align-items-start bg-white">
            <div class="container-fluid px-4">
                <table class="table bg-white w-100 table-striped">
                    <thead>
                    <tr class="border-top">
                        <th scope="col">ID</th>
                        <th scope="col">First Name</th>
                        <th scope="col">Last Name</th>
                        <th scope="col">Email</th>
                        <th scope="col">Age</th>
                        <th scope="col">Role</th>
                    </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/user.js"></script>
<script src="/js/header.js"></script>
<script src="/js/sidebar.js"></script>
</body>
</html>
